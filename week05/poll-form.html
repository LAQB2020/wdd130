<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Week 05 exercise creating forms  ">
        <meta name="author" content="Luis Quezada">
        <link rel="stylesheet" href="./styles/poll-form.css">
        <title>About Us Queretaro Rafting</title>
    </head>

    <body>
        <main>
            <h1>WDD 130 | HTML Form - User Poll</h1>
            <form >
                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required> 
                    <br>
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
                
                <div>
                    <label for="quantity">What is your favorite browser?</label>
                    <select name="quantity" id="quantity">
                        <option value="chrome">Chrome</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Brave</option>
                        <option value="other">Other</option>
                    </select>
                
                    <br>
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                    <br>
                    <label for="feedback">List the places you have lived:</label>
                    <textarea name="feedback" id="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuku Mali"></textarea>

                </div>
                <button type="submit">Submit Poll</button>


                <form>
                    <label>Please Enter Your Age:</label><input type="number" id="age" name="age">
                    <button type="submit">Submit Your Answer</button>
                </form>



            </form>
        </main>
    </body>

    <footer>

    </footer>

</html>
