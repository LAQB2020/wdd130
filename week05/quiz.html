<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>

    <main>

        <h1>✔ Basic HTML and CSS Quiz</h1>

        <form>

            <!-- Question 1 -->
            <div class="question">
                <label for="q1">
                    <strong>1.</strong> What does the acronym CSS stand for?
                </label>

                <input
                    type="text"
                    id="q1"
                    name="q1"
                    required>
            </div>

            <!-- Question 2 -->
            <div class="question">
                <label for="q2">
                    <strong>2.</strong> How are id and class attributes selected in CSS?
                </label>

                <textarea
                    id="q2"
                    name="q2"
                    rows="5"
                    required></textarea>
            </div>

            <!-- Question 3 -->
            <div class="question">
                <label for="q3">
                    <strong>3.</strong> Which of the following is a valid CSS comment?
                </label>

                <select id="q3" name="q3" required>

                    <option value="" selected disabled>
                        Choose One ...
                    </option>

                    <option value="// comment">
                        // This is a comment
                    </option>

                    <option value="/* comment */">
                        /* This is a comment */
                    </option>

                    <option value="<!-- comment -->">
                        <!-- This is a comment -->
                    </option>

                </select>
            </div>

            <!-- Question 4 -->
            <div class="question">

                <label for="q4">
                    <strong>4.</strong> How many heading levels does HTML have?
                </label>

                <input
                    type="number"
                    id="q4"
                    name="q4"
                    min="1"
                    max="10"
                    required>

            </div>

            <button type="submit">
                Submit Quiz
            </button>

        </form>

    </main>

</body>
</html>
